name: Generate deck index

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/generate-manifest.mjs"
      - ".github/workflows/generate-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate manifest
        run: node scripts/generate-manifest.mjs

      - name: Commit manifest if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate deck index"
          file_pattern: docs/manifest.json